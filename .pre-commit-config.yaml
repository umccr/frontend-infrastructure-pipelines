repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^(pnpm-lock.yaml)$
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key
      # - id: no-commit-to-branch
      #   args: [--branch, main, --branch, master, --pattern, release/.*]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(pnpm-lock.yaml)$

  # Local hooks run the repo's own tooling so they stay in sync with package.json.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        pass_filenames: false
        # Match every extension eslint.config.mjs lints (js/cjs/mjs/ts/cts/mts),
        # so editing the ESLint config itself also triggers the hook. tsconfig is
        # included because the type-checked rules resolve through it.
        files: \.[cm]?[jt]s$|^tsconfig.*\.json$

      - id: prettier
        name: prettier format
        entry: pnpm run prettier-fix
        language: system
        pass_filenames: false

      - id: pnpm-test
        name: pnpm test (jest + cdk-nag)
        entry: pnpm test
        language: system
        pass_filenames: false
        # Only run when source, tests, config (incl. jest.config.js) or the
        # lockfile change. \.ya?ml$ already covers pnpm-lock.yaml.
        files: \.([cm]?[jt]s|json|ya?ml)$
